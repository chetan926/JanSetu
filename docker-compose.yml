version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=SIH 2026 PS-129 Interoperability Platform
      - DATABASE_URL=sqlite:///./sih2026.db
      - SECRET_KEY=sih2026-super-secret-key-for-jwt-token-auth
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
